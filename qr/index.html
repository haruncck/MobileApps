<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0608">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="../bakim/icon.png"><link rel="apple-touch-icon" href="../bakim/icon.png">
<title>Gala Sahne QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a dark stage. One spotlight comes up on the QR, which stands alone in the light. Logo top, one line of text, nothing else. */
:root {
  --black: #0B0608;
  --floor: #17090B;
  --light: #FFF4E6;
  --red: #AF1E23;
  --ink: #1A1416;
  --paper: #FFFFFF;
  --dim: rgba(255,244,230,.55);
  --font-display: "Quicksand", "Avenir Next", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--black); color: var(--light); font-family: var(--font-display); overflow: hidden; }

.stage {
  position: relative; height: 100%; overflow: hidden; isolation: isolate; box-sizing: border-box;
  display: grid; grid-template-rows: auto 1fr auto; align-items: center; justify-items: center;
  padding-block: calc(clamp(22px, 4vh, 48px) + env(safe-area-inset-top, 0px)) calc(clamp(22px, 4vh, 48px) + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
/* the spotlight: a soft cone from above and a pool on the floor */
.spot {
  position: absolute; z-index: 0; left: 50%; top: 50%; width: 170vmax; height: 170vmax; transform: translate(-50%, -50%);
  background: radial-gradient(circle at 50% 50%, rgba(255,236,210,.30) 0%, rgba(255,230,200,.14) 14%, rgba(175,30,35,.08) 28%, transparent 46%);
  opacity: 0; animation: lightsup 2.6s ease-out .4s forwards;
  pointer-events: none;
}
.spot.pulse { animation: lightsup 2.6s ease-out .4s forwards, breathe 9s ease-in-out 3s infinite; }
@keyframes lightsup { to { opacity: 1; } }
@keyframes breathe { 50% { opacity: .78; } }
.cone {
  position: absolute; z-index: 0; left: 50%; top: -40vh; width: 90vmax; height: 140vh; transform: translateX(-50%);
  background: linear-gradient(to bottom, rgba(255,236,210,.10), rgba(255,236,210,.04) 55%, transparent 80%);
  clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
  opacity: 0; animation: lightsup 2.6s ease-out .4s forwards; pointer-events: none;
}

.logo { position: relative; z-index: 2; width: clamp(190px, 24vw, 320px); height: auto; opacity: 0; animation: lightsup 1.6s ease-out 1.4s forwards; filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }

.center { position: relative; z-index: 2; display: grid; justify-items: center; gap: clamp(18px, 3.5vh, 40px); }
.rig { position: relative; --s: min(60vh, 78vw, 620px); width: var(--s); max-width: 100%; }
.card {
  position: relative; width: 100%; aspect-ratio: 1; box-sizing: border-box; padding: calc(var(--s) * .07);
  background: var(--paper); border-radius: calc(var(--s) * .05); overflow: hidden;
  box-shadow: 0 40px 90px rgba(0,0,0,.8), 0 0 140px rgba(255,220,180,.18);
}
.wire { position: absolute; bottom: 100%; width: 2px; height: 120vh; background: linear-gradient(to bottom, rgba(255,244,230,0), rgba(255,244,230,.55) 30%, rgba(255,244,230,.8)); }
.wire.a { left: 18%; } .wire.b { right: 18%; }
.gloss { position: absolute; top: -20%; bottom: -20%; width: 28%; left: -40%; pointer-events: none; background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0)); transform: skewX(-18deg); animation: gloss 7s ease-in-out 4s infinite; }
@keyframes gloss { 0%, 70% { left: -40%; } 100% { left: 140%; } }
.rig { transform: translateY(-130vh); animation: flyin 2.4s cubic-bezier(.33,1.18,.4,1) 1s forwards; }
@keyframes flyin { 0% { transform: translateY(-130vh); } 100% { transform: translateY(0); } }
.rig.reset { animation: none; transform: translateY(-130vh); }
.rig.fly { animation: flyin 2.4s cubic-bezier(.33,1.18,.4,1) .2s forwards; }
.blackout { position: fixed; inset: 0; z-index: 8; background: #000; pointer-events: none; opacity: 0; transition: opacity .7s ease; }
.blackout.on { opacity: 1; }
.card canvas { display: block; width: 100% !important; height: 100% !important; }
h1 { margin: 0; font-weight: 400; font-size: clamp(22px, 3.2vw, 42px); letter-spacing: .01em; text-align: center; text-wrap: balance; opacity: 0; animation: lightsup 1.6s ease-out 1.8s forwards; }
h1 b { font-weight: 500; color: #fff; }

.foot {
  position: relative; z-index: 2; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center;
  font-family: var(--font-mono); font-size: clamp(11px, 1.1vw, 14px); letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  opacity: 0; animation: lightsup 1.6s ease-out 2.2s forwards;
}
.foot { flex-direction: column; gap: 10px; }
.foot .row1 { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
.foot .ise { opacity: .7; font-size: .9em; }
.foot .url { color: var(--light); font-weight: 500; font-size: clamp(16px, 1.8vw, 24px); letter-spacing: .06em; text-transform: none; letter-spacing: .04em; font-size: clamp(14px, 1.4vw, 18px); }
.foot i { width: 28px; height: 1px; background: var(--dim); display: inline-block; }

@media (orientation: landscape) and (min-width: 700px) {
  .stage { grid-template-rows: auto 1fr; }
  .card { --s: min(66vh, 40vw, 620px); }
}

/* controls */
.tools { position: fixed; z-index: 9; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); display: flex; gap: 8px; opacity: .18; transition: opacity .25s; }
.tools:hover, .tools:focus-within { opacity: 1; }
.tools button { font: 500 13px var(--font-display); color: var(--light); background: rgba(11,6,8,.7); border: 1px solid rgba(255,244,230,.3); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--light); outline-offset: 2px; }
.panel {
  position: fixed; z-index: 10; bottom: calc(54px + env(safe-area-inset-bottom, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
  width: min(360px, calc(100vw - 20px)); box-sizing: border-box; display: grid; gap: 12px;
  background: var(--paper); color: var(--ink); border-radius: 14px; padding: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.6); color-scheme: light;
}
.panel h2 { margin: 0; font: 500 15px var(--font-display); color: var(--red); }
.panel label { display: grid; gap: 5px; font-size: 12px; color: #6F6363; }
.panel input { font: 500 15px var(--font-display); color: var(--ink); background: #F5F0EF; border: 1px solid rgba(92,12,16,.2); border-radius: 8px; padding: 10px; width: 100%; box-sizing: border-box; }
.panel input:focus-visible, .panel button:focus-visible { outline-color: var(--red); }
.panel .row { display: flex; gap: 8px; justify-content: flex-end; }
.panel .row button { font: 500 14px var(--font-display); border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid rgba(175,30,35,.4); background: var(--paper); color: var(--red); }
.panel .row button.primary { background: var(--red); color: var(--paper); border-color: var(--red); }
.hint { margin: 0; font-size: 12px; line-height: 1.45; color: #6F6363; }

@media (prefers-reduced-motion: reduce) {
  .spot, .spot.pulse, .cone, .logo, .rig, .rig.fly, .gloss, h1, .foot { animation: none; opacity: 1; transform: none; }
  .blackout { display: none; }
}
</style>

  <div class="center">
    <div class="rig" id="rig"><span class="wire a" aria-hidden="true"></span><span class="wire b" aria-hidden="true"></span><div class="card"><div id="code" role="img" aria-label="QR code to our website"></div><span class="gloss" aria-hidden="true"></span></div></div>

  </div>

  <div class="foot"><span class="url" id="urlText"></span></div>
</main>

<div class="tools">
  <button type="button" id="editBtn">Düzenle</button>
  <button type="button" id="fsBtn">Tam ekran</button>
</div>

<form class="panel" id="panel" hidden>
  <h2>Sayfayı düzenle</h2>
  <label for="fUrl">Web sitesi adresi (QR buraya yönlendirir)
    <input id="fUrl" type="text" inputmode="url" autocomplete="off" placeholder="https://www.siteniz.com">
  </label>
  <p class="hint">Ayar bu tablette saklanır. Kaydettikten sonra QR'ı kendi telefonunuzla okutup deneyin.</p>
  <div class="row">
    <button type="button" id="cancelBtn">Kapat</button>
    <button type="submit" class="primary">Kaydet</button>
  </div>
</form>

<script src="qr-code-styling.js"></script>
<script>
(function () {
  var DEFAULT_URL = "https://www.galasahne.com.tr", KEY = "gala-sahne-qr-url", url = DEFAULT_URL;
  try { url = localStorage.getItem(KEY) || DEFAULT_URL; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var styled = null;
  function draw() {
    $("urlText").textContent = url.replace(/^https?:\/\//, "").replace(/\/$/, "");
    var box = $("code");
    if (window.QRCodeStyling) {
      var opts = {
        width: 1000, height: 1000, type: "canvas", data: url, margin: 0,
        qrOptions: { errorCorrectionLevel: "Q" },
        dotsOptions: { type: "square", color: "#1A1416" },
        cornersSquareOptions: { type: "square", color: "#AF1E23" },
        cornersDotOptions: { type: "square", color: "#AF1E23" },
        backgroundOptions: { color: "#FFFFFF" }
      };
      if (styled) styled.update(opts); else { styled = new QRCodeStyling(opts); styled.append(box); }
    } else if (window.QRious) {
      box.innerHTML = ""; var c = document.createElement("canvas"); box.appendChild(c);
      new QRious({ element: c, value: url, size: 1000, level: "Q", foreground: "#1A1416", background: "#FFFFFF" });
    }
  }
  draw();
  // stage cue every 22 s: blackout, fly the QR out, lights up, fly it back in
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) {
    setInterval(function () {
      var bo = $("blackout"), rig = $("rig");
      bo.classList.add("on");
      setTimeout(function () { rig.classList.remove("fly"); rig.classList.add("reset"); void rig.offsetWidth; }, 800);
      setTimeout(function () { bo.classList.remove("on"); rig.classList.remove("reset"); rig.classList.add("fly"); }, 1500);
    }, 22000);
  }
  var panel = $("panel");
  $("editBtn").addEventListener("click", function () { $("fUrl").value = url; panel.hidden = !panel.hidden; if (!panel.hidden) $("fUrl").focus(); });
  $("cancelBtn").addEventListener("click", function () { panel.hidden = true; });
  panel.addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("fUrl").value.trim(); if (u && !/^https?:\/\//i.test(u)) u = "https://" + u;
    url = u || DEFAULT_URL; try { localStorage.setItem(KEY, url); } catch (err) {}
    draw(); panel.hidden = true;
  });
  $("fsBtn").addEventListener("click", function () {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
      else if (document.exitFullscreen) document.exitFullscreen().catch(function () {});
    } catch (e) {}
  });
  function keepAwake() { try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(function () {}); } catch (e) {} }
  keepAwake(); document.addEventListener("visibilitychange", function () { if (!document.hidden) keepAwake(); });
  document.addEventListener("click", keepAwake, { once: true });
})();
</script>
