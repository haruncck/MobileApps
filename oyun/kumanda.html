<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090D">
<title>Dekor Yakala — Kumanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@500;700&display=swap">
<style>
/* Layout: one phone screen, no scrolling. Top: status/score. Middle: the slider track = the stage car. Thumb follows your finger anywhere on the track. */
:root{--bg:#07090D;--fg:#F2F0EA;--muted:#8E95A3;--accent:#F5B041;--on:#1A1203;--panel:#131824;--good:#5BD38F;
  --f-big:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--f:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
.app{height:100%;display:flex;flex-direction:column;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
h1{margin:0;font-family:var(--f-big);font-weight:900;font-size:44px;line-height:.9;text-transform:uppercase;color:var(--accent)}
.sub{color:var(--muted);font-size:15px;margin-top:6px}
.card{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
input{width:100%;min-height:54px;padding:0 14px;border:1px solid #2A3242;border-radius:12px;background:#0C1019;color:var(--fg);font:inherit;font-size:20px}
.btn{min-height:58px;border:0;border-radius:14px;background:var(--accent);color:var(--on);font:inherit;font-weight:700;font-size:19px}
.btn:disabled{opacity:.5}
.status{font-family:var(--f-big);font-weight:900;font-size:34px;line-height:1;text-transform:uppercase}
.status small{display:block;font-family:var(--f);font-size:14px;font-weight:500;color:var(--muted);text-transform:none;margin-top:4px}
.score{font-family:var(--f-big);font-weight:900;font-size:72px;line-height:.9;color:var(--good);font-variant-numeric:tabular-nums}
.pad{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.track{position:relative;height:130px;border-radius:20px;background:linear-gradient(#1A2130,#0F141E);border:1px solid #2A3242;overflow:hidden}
.track::before{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:#3B2F22}
.slots{position:absolute;inset:0;display:flex}
.slots span{flex:1;border-right:1px dashed rgba(255,255,255,.12);display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:12px;color:rgba(255,255,255,.35)}
.slots span:last-child{border:0}
.car{position:absolute;bottom:10px;width:19%;height:34px;margin-left:-9.5%;border-radius:8px;background:var(--accent);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 0 30px rgba(245,176,65,.5)}
.hint{text-align:center;color:var(--muted);font-size:14px}
.big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(7,9,13,.9)}
.big h2{margin:0;font-family:var(--f-big);font-weight:900;font-size:64px;line-height:.9;text-transform:uppercase}
.big p{font-size:20px;color:var(--muted);margin:10px 0 0}
.big p b{color:var(--accent);font-size:28px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div><h1>Dekor Yakala</h1><div class="sub">Gala Sahne · Smart Kontrol</div></div>
  <div class="card" id="join">
    <label for="name" style="color:var(--muted);font-size:14px">Adın (skor tablosunda görünür)</label>
    <input id="name" maxlength="16" placeholder="Ör. Harun" autocomplete="off">
    <button class="btn" id="go">Sıraya gir</button>
  </div>
  <div class="card" id="state" hidden>
    <div class="status" id="st">Sıradasın<small id="stSub">Sahne ekranına bak</small></div>
    <div class="score" id="sc" hidden>0</div>
  </div>
  <div class="pad" id="pad" hidden>
    <div class="hint">Parmağını sürükle: sahnedeki araba seni izler</div>
    <div class="track" id="track"><div class="slots"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><div class="car" id="car" style="left:50%">ARABA</div></div>
  </div>
</div>
<div class="big" id="big" hidden><div><h2 id="bigT">Perde!</h2><p id="bigP"></p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(function(){
"use strict";
var NTFY="https://ntfy.sh/",$=function(id){return document.getElementById(id)};
var m=/[#&]k=([a-z0-9-]{6,64})/.exec(location.hash||""),topic=m?m[1]:"";
if(!topic){$("join").innerHTML="<p>Bu sayfa standdaki karekoddan açılmalı.</p>";return}
var id="p"+Math.random().toString(36).slice(2,9),score=0,conn=null,direct=false;
function send(t,m){if(conn&&conn.open){try{conn.send({t:t,m:m,s:Date.now()});return}catch(e){}}post(m,[t])}
function connect(cb){
  var done=false,fin=function(ok){if(done)return;done=true;direct=ok;cb()};
  try{
    var peer=new Peer(null,{debug:0,config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]}});
    peer.on("open",function(){
      var c=peer.connect("gs-"+topic,{reliable:false,serialization:"json"});
      c.on("open",function(){conn=c;fin(true)});
      c.on("data",function(d){if(d&&d.t)feedback(d.t,String(d.m||""))});
      c.on("close",function(){conn=null});
      c.on("error",function(){fin(false)});
    });
    peer.on("error",function(){fin(false)});
    setTimeout(function(){fin(false)},8000);
  }catch(e){fin(false)}
}
function post(msg,tags){var x=new XMLHttpRequest();x.open("POST",NTFY,true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify({topic:topic,message:msg,title:id,tags:tags}))}
try{$("name").value=localStorage.getItem("dy.name")||""}catch(e){}
$("go").addEventListener("click",function(){
  var n=$("name").value.trim();if(!n){$("name").focus();return}
  try{localStorage.setItem("dy.name",n)}catch(e){}
  $("go").disabled=true;$("go").textContent="Bağlanıyor…";
  connect(function(){send("join",n);$("join").hidden=true;$("state").hidden=false;$("stSub").textContent=direct?"Sahne ekranına bak · doğrudan bağlantı":"Sahne ekranına bak · YAVAŞ BAĞLANTI (doğrudan bağlantı kurulamadı)";if(!direct)listen()});
});
/* slider */
var track=$("track"),car=$("car"),last=0,lastV=-1;
function setX(clientX){
  var r=track.getBoundingClientRect(),v=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
  car.style.left=(v*100)+"%";
  var now=Date.now();
  var gap=direct?33:70;
  if(now-last>gap&&Math.abs(v-lastV)>0.003){last=now;lastV=v;send("move",v.toFixed(3))}
}
function onT(e){if(e.touches&&e.touches[0])setX(e.touches[0].clientX);e.preventDefault()}
track.addEventListener("touchstart",onT,{passive:false});track.addEventListener("touchmove",onT,{passive:false});
track.addEventListener("mousedown",function(e){setX(e.clientX);var mv=function(e){setX(e.clientX)};addEventListener("mousemove",mv);addEventListener("mouseup",function(){removeEventListener("mousemove",mv)},{once:true})});
/* feedback from the screen */
function listen(){
  var es=new EventSource(NTFY+topic+"-"+id+"/sse");
  es.onmessage=function(ev){
    try{var j=JSON.parse(ev.data)}catch(e){return}
    if(j.event!=="message")return;
    feedback((j.tags||[])[0],j.message||"");
  };
  es.onerror=function(){es.close();setTimeout(listen,2000)};
  esRef=es;
}
var esRef=null;
function feedback(tag,msg){
    var t=[tag];
    if(t.indexOf("queued")>-1){$("stSub").textContent=msg}
    if(t.indexOf("start")>-1){$("st").firstChild.nodeValue="Sahne senin!";$("stSub").textContent="30 saniye"+(direct?"":" · yavaş bağlantı");$("sc").hidden=false;$("pad").hidden=false;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
    if(t.indexOf("hit")>-1){score+=parseInt(msg,10)||0;$("sc").textContent=String(score);try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}
    if(t.indexOf("end")>-1){$("pad").hidden=true;$("bigT").textContent=score>=60?"Bravo!":"Perde!";$("bigP").innerHTML="";var b=document.createElement("b");b.textContent=msg;$("bigP").appendChild(b);$("big").hidden=false;
      setTimeout(function(){$("big").hidden=true;$("state").hidden=true;$("join").hidden=false;$("go").disabled=false;score=0;$("sc").textContent="0";$("sc").hidden=true;$("st").firstChild.nodeValue="Sıradasın";$("stSub").textContent="Sahne ekranına bak";if(esRef)esRef.close();if(conn){try{conn.close()}catch(e){}conn=null}},6000)}
}
})();
</script>
</body>
</html>
