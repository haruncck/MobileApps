# Hesap Defteri: ücretsiz Supabase projesi 7 gün hareketsiz kalınca beklemeye alınır.
# Bu görev iki günde bir veritabanına zararsız bir sorgu atarak projeyi uyanık tutar.
# Ayın 1'inde .github/uyanik.txt dosyasına tarih yazar: GitHub, 60 gün değişiklik olmayan
# depolarda zamanlanmış görevleri kapattığı için bu kayıt görevin kapanmasını önler.
name: Hesap Defteri - bulutu uyanik tut

on:
  schedule:
    - cron: '23 5 */2 * *' # iki günde bir, 08:23 Türkiye saati (ayın 1'i her zaman dahil)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase veritabanina sorgu at
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o out.txt -w '%{http_code}' -X POST \
              'https://fdgbqmjquvkkrgoozxwj.supabase.co/rest/v1/rpc/keepalive' \
              -H 'apikey: sb_publishable_9KNGx9OqBtUFiQ0Q2nHE8g_bIP1GoXc' \
              -H 'Content-Type: application/json' -d '{}')
            echo "HTTP $code: $(cat out.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase yanit vermedi. Proje beklemeye alinmis olabilir: supabase.com > hesap-defteri > Resume project"
          exit 1

      - name: Ayin 1'i mi?
        id: gun
        run: echo "ilk=$([ "$(date -u +%d)" = "01" ] && echo evet || echo hayir)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gun.outputs.ilk == 'evet' || github.event_name == 'workflow_dispatch'

      - name: Depoya kayit dus (zamanlanmis gorev kapanmasin)
        if: steps.gun.outputs.ilk == 'evet' || github.event_name == 'workflow_dispatch'
        run: |
          date -u +"%Y-%m-%d %H:%M UTC - Hesap Defteri bulutu uyanik" > .github/uyanik.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/uyanik.txt
          git commit -m "Hesap Defteri: aylik uyanik tutma kaydi" || exit 0
          git push
