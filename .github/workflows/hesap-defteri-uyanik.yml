# Hesap Defteri: ücretsiz Supabase projesi 7 gün hareketsiz kalınca beklemeye alınır.
# Bu görev iki günde bir veritabanına zararsız bir sorgu atarak projeyi uyanık tutar.
# Ayın 1'inde .github/uyanik.txt dosyasına tarih yazar: GitHub, 60 gün değişiklik olmayan
# depolarda zamanlanmış görevleri kapattığı için bu kayıt görevin kapanmasını önler.
name: Hesap Defteri - bulutu uyanik tut

on:
  schedule:
    - cron: '23 5 */2 * *' # iki günde bir, 08:23 (Türkiye)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase veritabanina sorgu at
        run: |
          set -e
          for i in 1 2 3; do
            code=$(curl -s -o out.txt -w '%{http_code}' -X POST \
              'https://fdgbqmjquvkkrgoozxwj.supabase.co/rest/v1/rpc/keepalive' \
              -H 'apikey: sb_publishable_9KNGx9OqBtUFiQ0Q2nHE8g_bIP1GoXc' \
              -H 'Content-Type: application/json' -d '{}')
            echo "HTTP $code: $(cat out.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase yanit vermedi. Proje beklemeye alinmis olabilir: supabase.com > hesap-defteri > Resume project"
          exit 1

      - name: Ayda bir depoya kayit dus (zamanlanmis gorev kapanmasin)
        if: github.event_name == 'workflow_dispatch' || startsWith(format('{0}', github.event.schedule), '23 5') && contains('01,02', format('{0}', '01'))
        uses: actions/checkout@v4

      - name: Kayit
        if: github.event_name == 'workflow_dispatch'
        run: echo "manual"
